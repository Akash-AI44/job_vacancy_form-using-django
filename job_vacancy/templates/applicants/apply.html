<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
</head>
<body>

    <h2>Job Application Form</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <p>
            <label>Name:</label><br>
            {{ form.name }}
            {{ form.name.errors }}
        </p>

        <p>
            <label>Email:</label><br>
            {{ form.email }}
            {{ form.email.errors }}
        </p>

        <p>
            <label>Address:</label><br>
            {{ form.address }}
            {{ form.address.errors }}
        </p>

        <p>
            <label>Upload CV:</label><br>
            {{ form.cv }}
            {{ form.cv.errors }}
        </p>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
